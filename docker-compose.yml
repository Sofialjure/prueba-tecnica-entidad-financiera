services:
  postgres:
    image: postgres:16-alpine
    container_name: entidad-financiera-db
    environment:
      POSTGRES_DB: ${DB_NAME:-entidad_financiera}
      POSTGRES_USER: ${DB_USERNAME:-entidad_financiera}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-entidad_financiera}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
