<h1>Bienvenido</h1>
<p class="intro">Sistema de gestión de clientes, cuentas y transacciones de la entidad financiera.</p>

<div class="modules">
  @for (module of modules; track module.title) {
    <mat-card appearance="outlined">
      <mat-card-header>
        <mat-icon mat-card-avatar>{{ module.icon }}</mat-icon>
        <mat-card-title>{{ module.title }}</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <p>{{ module.description }}</p>
      </mat-card-content>
    </mat-card>
  }
</div>
