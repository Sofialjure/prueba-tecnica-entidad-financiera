<mat-toolbar class="toolbar">
  @if (sidenavMode() === 'over') {
    <button mat-icon-button aria-label="Abrir menú" (click)="sidenav.toggle()">
      <mat-icon>menu</mat-icon>
    </button>
  }
  <mat-icon class="brand-icon">account_balance</mat-icon>
  <span>Entidad Financiera</span>
</mat-toolbar>

<mat-sidenav-container class="container">
  <mat-sidenav #sidenav [mode]="sidenavMode()" [opened]="sidenavOpened()" class="sidenav">
    <mat-nav-list>
      @for (item of navItems; track item.route) {
        <a
          mat-list-item
          [routerLink]="item.route"
          routerLinkActive
          #link="routerLinkActive"
          [routerLinkActiveOptions]="{ exact: item.route === '/' }"
          [activated]="link.isActive"
          (click)="sidenavMode() === 'over' && sidenav.close()"
        >
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <main class="content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
