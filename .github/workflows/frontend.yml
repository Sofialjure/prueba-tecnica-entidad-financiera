name: Frontend

on:
  push:
    branches: [develop, main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
      - '.github/scripts/coverage_summary.py'
  pull_request:
    branches: [develop, main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
      - '.github/scripts/coverage_summary.py'

# A newer push to the same branch or PR cancels the run that is still going
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  test:
    name: Probar y compilar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        run: npm ci --no-audit --no-fund

      # Fails if coverage drops below coverageThresholds in angular.json
      - name: Tests unitarios con cobertura (Vitest)
        run: npm run test:coverage

      - name: Resumen de cobertura
        if: success() || failure()
        run: |
          if [ -f coverage/frontend/coverage-summary.json ]; then
            python3 ../.github/scripts/coverage_summary.py vitest coverage/frontend/coverage-summary.json
          fi

      - name: Guardar reporte de cobertura
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage/frontend/
          if-no-files-found: ignore
          retention-days: 14

      # Production build; fails if the bundle goes over the error budget in angular.json
      - name: Compilación de producción
        run: npm run build

  docker:
    name: Construir imagen Docker
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Only checks that the image builds; it is not pushed anywhere yet
      - uses: docker/build-push-action@v7
        with:
          context: frontend
          push: false
          tags: entidad-financiera-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
