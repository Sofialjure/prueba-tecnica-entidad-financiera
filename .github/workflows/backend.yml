name: Backend

on:
  push:
    branches: [develop, main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [develop, main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

# A newer push to the same branch or PR cancels the run that is still going
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  test:
    name: Compilar y probar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Unit tests and integration tests against PostgreSQL (Testcontainers uses the
      # runner's Docker), plus the JaCoCo coverage report
      - name: mvnw verify
        run: ./mvnw -B -ntp verify

      - name: Guardar reportes de tests si fallan
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
          retention-days: 7

  docker:
    name: Construir imagen Docker
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Only checks that the image builds; it is not pushed anywhere yet
      - uses: docker/build-push-action@v7
        with:
          context: backend
          push: false
          tags: entidad-financiera-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
